# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v1.0.0) is created — after the Tests workflow (build, lint,
# docs freshness, unit tests and, when a test hub is configured, the
# acceptance suite) has passed on that very commit.
on:
  push:
    tags:
      - 'v*'

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login in the acceptance job

  goreleaser:
    needs: tests
    runs-on: ubuntu-latest
    # The signing key lives in this environment: v* tags only, approval required.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      # The GitHub release body is the tag's section of CHANGELOG.md; a tag
      # without a dated section fails here, before anything is published.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
