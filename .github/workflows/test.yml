# Build, lint, docs-freshness and unit tests on every push / PR, and as the
# gate of the Release workflow (workflow_call on a v* tag).
#
# Acceptance tests need a real IoT Hub. They run
#   - on demand (workflow_dispatch),
#   - on pushes to main and on release tags when the repository variable
#     IOTHUB_TEST_HOSTNAME is set,
# and authenticate either with a shared access policy (secret
# IOTHUB_CONNECTION_STRING) or with Entra ID through azure/login and an OIDC
# federated credential (secrets AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, held by the GitHub environment "acceptance"). The
# job runs in that environment, so the OIDC subject is
# repo:<owner>@<id>/<repo>@<id>:environment:acceptance on every ref and event
# and a single federated credential covers pushes, tags and manual runs.
# Optional: IOTHUB_TEST_BLOB_CONTAINER_SAS_URI enables the import/export
# job test.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONCEPT.md'
  push:
    branches: ['**'] # tags run through the Release workflow instead
    paths-ignore:
      - 'README.md'
      - 'CONCEPT.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    name: Docs are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference after code generation. Run 'make generate' and commit."; exit 1)

  unit:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go test -race -cover ./...

  acceptance:
    name: 'Acceptance tests: Terraform ${{ matrix.terraform }}'
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.IOTHUB_TEST_HOSTNAME != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: acceptance
    # Serialise: the tests share one hub and the free tier allows few concurrent operations.
    concurrency:
      group: acceptance-${{ vars.IOTHUB_TEST_HOSTNAME }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    env:
      # Job-level so the `if` below can see it (secrets are not usable in `if` directly).
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform:
          - '1.14.*'
          - '1.15.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      # Entra ID via OIDC: only when a federated credential is configured.
      # The provider then authenticates through the Azure CLI login.
      - name: Azure login (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: go mod download
      - name: Acceptance tests
        env:
          TF_ACC: "1"
          IOTHUB_TEST_HOSTNAME: ${{ vars.IOTHUB_TEST_HOSTNAME }}
          IOTHUB_CONNECTION_STRING: ${{ secrets.IOTHUB_CONNECTION_STRING }}
          # optional: a container SAS URI (racwdl) for the import/export job test
          IOTHUB_TEST_BLOB_CONTAINER_SAS_URI: ${{ secrets.IOTHUB_TEST_BLOB_CONTAINER_SAS_URI }}
          ARM_USE_CLI: ${{ env.AZURE_CLIENT_ID != '' }}
        run: go test -v -cover -timeout 50m -run 'TestAcc' ./internal/...
